[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-tool"
version = "0.1.0"
description = "Unified knowledge base management tool for wikilink-based knowledge graphs"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [
    {name = "Kita", email = "kita@example.com"},
]
readme = "README.md"
keywords = ["knowledge-base", "wikilinks", "graph-analysis", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "click>=8",
    "networkx>=3",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.urls]
Homepage = "https://github.com/VKKKV/kb-tool"
Repository = "https://github.com/VKKKV/kb-tool"
Issues = "https://github.com/VKKKV/kb-tool/issues"

[project.scripts]
kb = "kb.cli:main"
kb-tool = "kb.cli:main"

[tool.setuptools.packages.find]
include = ["kb*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
