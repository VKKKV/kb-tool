name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install development dependencies
        run: uv sync --extra dev --group dev --extra interactive
      - name: Run tests
        run: uv run pytest -q
      - name: Lint changed package and config tests
        run: uv run ruff check kb/config.py kb/core.py kb/graph_colors.py kb/graph_groups.py kb/plugins.py kb/builtin_analyzers.py tests/test_config.py tests/test_graph_colors.py tests/test_graph_groups.py tests/test_plugins.py
      - name: Type-check configuration and palette modules
        run: uv run mypy --python-executable .venv/bin/python kb/config.py kb/graph_colors.py kb/core.py kb/plugins.py kb/builtin_analyzers.py
